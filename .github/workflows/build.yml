name: build

on:
  workflow_dispatch:

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h

      - uses: actions/checkout@v4

      - name: Install elan and toolchain
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install leanprover/lean4:v4.33.1
          elan default leanprover/lean4:v4.33.1
          lake --version

      - name: Fetch Mathlib cache
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get

      - name: Restore project build cache
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: lake-build-${{ github.run_id }}
          restore-keys: |
            lake-build-

      - name: Build (resumable)
        continue-on-error: true
        timeout-minutes: 285
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake build 2>&1 | tee build.log

      - name: Build progress snapshot
        if: always()
        run: |
          echo "olean count: $(find .lake/build -name '*.olean' 2>/dev/null | wc -l)"
          echo "--- last 40 lines of build.log ---"
          tail -40 build.log || true
          df -h
          du -sh .lake/build || true

      - name: Save project build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: lake-build-${{ github.run_id }}
